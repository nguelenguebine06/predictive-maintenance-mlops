

projet:
  name: predictive-maintenance-mlops
  random_state: 42

data:
  raw_path: data/raw/
  dataset_name: MetroPT3(AirCompressor).csv

  processed_path: data/processed/
  processed_dataset_name: MetroPT3_labeled.csv

  timestamp_column: timestamp
  target_column: target_event
  event_id_column: event_id

target:
  name: target_event

  positive_class: 1
  negative_class: 0

  definition: document_air_leak_events

  events:
    - event_id: 1
      start: "2020-04-18 00:00:00"
      end: "2020-04-18 23:59:00"

    - event_id: 2
      start: "2020-05-29 23:30:00"
      end: "2020-05-30 06:00:00"

    - event_id: 3
      start: "2020-06-05 10:00:00"
      end: "2020-06-07 14:30:00"

    - event_id: 4
      start: "2020-07-15 14:30:00"
      end: "2020-07-15 19:00:00"

features:

  numeric:
    - TP2
    - TP3
    - H1
    - DV_pressure
    - Reservoirs
    - Oil_temperature
    - Motor_current

  categorical:
    - COMP
    - DV_eletric
    - Towers
    - MPG
    - LPS
    - Pressure_switch
    - Oil_level
    - Caudal_impulses

  baseline:
    - TP2
    - TP3
    - H1
    - DV_pressure
    - Reservoirs
    - Oil_temperature
    - Motor_current
    - COMP
    - DV_eletric
    - Towers
    - MPG
    - LPS
    - Pressure_switch
    - Oil_level
    - Caudal_impulses

  excluded:
    - timestamp
    - event_id
    - target_event
    - Unnamed: 0

validation:

  strategy: leave_one_event_out

  n_splits: 4

  test_window:
      hours_before_event: 24
      hours_after_event: 24

  threshold_selection:
    metric: f2
    beta: 2

    search:
      start: 0.01
      stop: 0.99
      step: 0.01

    tie_break: higher_threshold

model:

  name: logistic_regression
  type: classification

  parameters:
    class_weight: balanced
    max_iter: 2000
    solver: lbfgs
    random_state: 42

  preprocessing:
    scaling: standard


evaluation:

  positive_label: 1

  metrics:
    - precision
    - recall
    - f1
    - f2
    - roc_auc
    - average_precision
    - balanced_accuracy

  confusion_matrix: true

  classification_report: true

artefacts:

  models_dir: model/
  reports_dir: reports/
  figures_dir: reports/figures/
  metrics_dir: reports/metrics/
  logs-dir: logs/

  save_model: true
  save_metrics: true
  save_figures: true





